services:
  documentx:
    build: .
    image: documentx:local
    ports:
      - "8080:8080"
    environment:
      DOCUMENTX_LLM_BASE_URL: ${DOCUMENTX_LLM_BASE_URL}
      DOCUMENTX_LLM_API_KEY: ${DOCUMENTX_LLM_API_KEY}
      DOCUMENTX_LLM_MODEL: ${DOCUMENTX_LLM_MODEL:-gpt-4o-mini}
      DOCUMENTX_SERVER_BASE_PATH: ${DOCUMENTX_SERVER_BASE_PATH:-/documentx}
      DOCUMENTX_CONTENT_MODE: s3
      DOCUMENTX_CONTENT_REFRESH_INTERVAL_SECS: ${DOCUMENTX_CONTENT_REFRESH_INTERVAL_SECS:-300}
      DOCUMENTX_CONTENT_S3_ENDPOINT: ${DOCUMENTX_CONTENT_S3_ENDPOINT}
      DOCUMENTX_CONTENT_S3_REGION: ${DOCUMENTX_CONTENT_S3_REGION:-us-east-1}
      DOCUMENTX_CONTENT_S3_BUCKET: ${DOCUMENTX_CONTENT_S3_BUCKET}
      DOCUMENTX_CONTENT_S3_ROOT_PREFIX: ${DOCUMENTX_CONTENT_S3_ROOT_PREFIX:-documentx}
      DOCUMENTX_CONTENT_S3_FORCE_PATH_STYLE: ${DOCUMENTX_CONTENT_S3_FORCE_PATH_STYLE:-true}
      DOCUMENTX_CONTENT_S3_ALLOW_HTTP: ${DOCUMENTX_CONTENT_S3_ALLOW_HTTP:-false}
      DOCUMENTX_CONTENT_S3_ACCESS_KEY_ID: ${DOCUMENTX_CONTENT_S3_ACCESS_KEY_ID}
      DOCUMENTX_CONTENT_S3_SECRET_ACCESS_KEY: ${DOCUMENTX_CONTENT_S3_SECRET_ACCESS_KEY}
      DOCUMENTX_CONTENT_S3_SESSION_TOKEN: ${DOCUMENTX_CONTENT_S3_SESSION_TOKEN:-}
    restart: unless-stopped
