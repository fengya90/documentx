[package]
name = "documentx"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "compression-br",
    "compression-gzip",
    "cors",
    "trace",
    "fs",
    "limit",
    "timeout",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "gzip",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
futures = "0.3"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dotenvy = "0.15"
walkdir = "2"
typst-as-lib = "0.16"
typst-pdf = "0.15"
typst = "0.15"
typst-layout = "0.15"
docx-rs = "0.4.22"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
object_store = { version = "0.14", features = ["aws"] }

[profile.release]
opt-level = 3
lto = "thin"
